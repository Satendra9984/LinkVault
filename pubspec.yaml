name: link_vault
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.3.0+26


environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # hive: ^2.2.3
  flutter_dotenv: ^6.0.0
  html: ^0.15.4
  http: ^1.2.1
  path: ^1.8.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  flutter_riverpod: ^2.5.1
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.5.4
  share_plus: ^11.0.0
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  fpdart: ^1.1.0
  logger: ^2.6.2
  # hive_flutter: ^1.1.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.0.9
  cloud_firestore: ^5.0.2
  google_mobile_ads: ^6.0.0
  lottie: ^3.1.2
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  gma_mediation_meta: ^1.0.1
  gma_mediation_unity: ^1.0.0
  flutter_localizations:
    sdk: flutter
  xml: ^6.5.0
  intl: ^0.20.2
  cached_network_image: ^3.4.0
  flutter_cache_manager: ^3.4.1
  visibility_detector: ^0.4.0+2
  flutter_custom_tabs: ^2.1.0
  flutter_inappwebview: ^6.0.0
  google_fonts: ^6.2.1
  objectbox: ^4.0.3
  objectbox_flutter_libs: ^4.0.3
  supabase_flutter: ^2.9.0
  go_router: ^15.1.1
  freezed: ^2.5.2
  pinput: ^6.0.2
  rxdart: ^0.28.0
  smooth_page_indicator: ^1.2.1
  connectivity_plus: ^6.1.4
  app_links: ^6.4.0
  app_tracking_transparency: ^2.0.6+1
  purchases_flutter: ^9.12.0
  flutter_markdown: ^0.7.7+1
  file_picker: ^10.3.10
  package_info_plus: ^9.0.0
  uuid: ^4.5.2
  collection: ^1.19.1
  image_picker: ^1.2.1

  # Legacy deps (still present during the refactor).
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  receive_sharing_intent:
    git:
      url: https://github.com/KasemJaffer/receive_sharing_intent.git
      ref: master  # Uses the master branch with the fix

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_flavorizr: ^2.4.1
  # hive_generator: ^2.0.1
  rename: ^3.0.2
  very_good_analysis: ^8.0.0
  path_provider_platform_interface: ^2.1.2
  mockito: ^5.4.4
  isar_generator: ^3.1.0+1
  objectbox_generator: ^4.0.3
  analyzer: ^5.13.0
  

# dependency_overrides:
  # url_launcher_windows:
  #   sdk: 'none'


flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.production
    - assets/images/
    - assets/animations/

    #  - assets/js/readability/readabilityjs/
    #  - assets/js/readability/readabilityjs/Readability.js

# Specify the supported platforms (remove windows)
platform:
  android:
    default: true
  ios:
    default: true

flavorizr:
  app:
    android:
      flavorDimensions: "env"
    ios: {}
  flavors:
    dev:
      app:
        name: "Link Vault (Dev)"
      android:
        applicationId: "com.example.link_vault.dev"
    production:
      app:
        name: "Link Vault"
      android:
        applicationId: "com.example.link_vault"
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/abstract-link_512.png"

  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  