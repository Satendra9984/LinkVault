  # url_launcher_windows:
  #   sdk: 'none'


flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/animations/

    #  - assets/js/readability/readabilityjs/
    #  - assets/js/readability/readabilityjs/Readability.js

# Specify the supported platforms (remove windows)
platform:
  android:
    default: true
  ios:
    default: true
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/abstract-link_512.png"

  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  